services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - FRONTEND_ORIGIN=http://localhost

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:3001
    ports:
      - "80:80"
    depends_on:
      - backend
